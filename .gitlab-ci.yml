# You can override the included template(s) by including variable overrides
# See https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
stages:
  - test
  - build
  - release

build:
  image: node:22-bookworm
  stage: build
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends xz-utils
  script:
    - npm ci
    - npm run publish
  artifacts:
    paths:
      - ai-pathfinding-project.tar.xz

release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: release
  needs:
    - job: build
      artifacts: true
  # Branch pipelines verify builds; only protected tags can publish immutable assets.
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - apk add --no-cache curl
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ai-pathfinding-project.tar.xz "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/ai-pathfinding-project.tar.xz"'
  release:
    tag_name: $CI_COMMIT_TAG
    name: Release $CI_COMMIT_TAG
    description: Automated release of $CI_COMMIT_TAG.
    assets:
      links:
        - name: ai-pathfinding-project.tar.xz
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/ai-pathfinding-project.tar.xz"
          direct_asset_path: /projects/ai-pathfinding-project.tar.xz

include:
  - template: Jobs/SAST.gitlab-ci.yml
